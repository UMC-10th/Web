<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS MISSION1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: white;
      padding: 20px 0;
    }

    .navbar {
      width: 90%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 32px;
      background: white;
      border: 4px solid black;
      border-radius: 35px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar__left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .navbar__logo {
      width: 44px;
      height: 44px;
      background: orange;
      border: 3px solid black;
      border-radius: 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 22px;
    }

    .navbar__brand {
      font-size: 24px;
      font-weight: 700;
      color: grey;
    }

    .navbar__right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .navbar__menu {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .navbar__link {
      text-decoration: none;
      color: grey;
      font-size: 16px;
      font-weight: 700;
    }

    .navbar__link--download {
      color: orange;
    }

    .navbar__link--active {
      color: orange;
    }

    .navbar__language {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar__language-label {
      color: grey;
      font-size: 16px;
      font-weight: 700;
    }

    .navbar__lang-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 3px solid black;
      border-radius: 999px;
      background: white;
    }

    .navbar__lang-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: black;
    }

    .navbar__lang-btn--active {
      background: orange;
      color: white;
    }

    @media (max-width: 1000px) {
      .navbar__language-label {
        display: none;
      }
    }

    @media (max-width: 800px) {
      .navbar__menu {
        display: none;
      }

      .navbar {
        padding: 16px 20px;
      }

      .navbar__brand {
        font-size: 20px;
      }

      .navbar__right {
        gap: 12px;
      }

      .navbar__lang-btn {
        padding: 8px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar__left">
      <div class="navbar__logo">🐱</div>
      <div class="navbar__brand">Aido</div>
    </div>

    <div class="navbar__right">
      <div class="navbar__menu">
        <a href="#friends" class="navbar__link">고양이 친구들</a>
        <a href="#download" class="navbar__link navbar__link--download">출시 알림 받기</a>
      </div>

      <div class="navbar__language">
        <span class="navbar__language-label">언어</span>
        <div class="navbar__lang-group">
          <button class="navbar__lang-btn" id="lang-ko">KO</button>
          <button class="navbar__lang-btn" id="lang-en">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <script>
    const path = window.location.pathname;
    const koBtn = document.getElementById("lang-ko");
    const enBtn = document.getElementById("lang-en");

    koBtn.classList.remove("navbar__lang-btn--active");
    enBtn.classList.remove("navbar__lang-btn--active");

    if (path === "/en") {
      enBtn.classList.add("navbar__lang-btn--active");
    } else {
      koBtn.classList.add("navbar__lang-btn--active");
    }
  </script>
</body>
</html>
