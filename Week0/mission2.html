<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS MISSION2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .layout {
      width: 100%;
      min-height: 100vh;
    }

    .layout__box {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: 500;
    }

    .layout__top {
      display: flex;
      height: 140px;
    }

    .layout__header {
      flex: 1;
      background: black;
      color: white;
    }

    .layout__menu {
      flex: 3;
      background: red;
      color: white;
    }

    .layout__hero {
      height: 420px;
      background: steelblue;
      color: white;
    }

    .layout__content {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 260px 260px;
    }

    .layout__main {
      grid-column: 1/2;
      grid-row: 1/3;
      background: midnightblue;
      color: white;
    }

    .layout__blank {
      grid-column: 2/3;
      grid-row: 1/3;
      background: white;
    }

    .layout__image {
      grid-column: 3/4;
      grid-row: 1/2;
      background: lightblue;
      color: black;
    }

    .layout__extra {
      grid-column: 3/4;
      grid-row: 2/3;
      background: mediumseagreen;
      color: black;
    }

    .layout__banner {
      height: 170px;
      background: gold;
      color: black;
    }

    @media (max-width: 768px) {
      .layout__box {
        font-size: 2rem;
      }

      .layout__content {
        grid-template-columns: 1fr;
        grid-template-rows: 220px 180px 180px;
      }

      .layout__main {
        grid-column: 1/2;
        grid-row: 1/2;
      }

      .layout__blank {
        display: none;
      }

      .layout__image {
        grid-column: 1/2;
        grid-row: 2/3;
      }

      .layout__extra {
        grid-column: 1/2;
        grid-row: 3/4;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="layout__top">
      <div class="layout__header layout__box">HEADER</div>
      <div class="layout__menu layout__box">MENU</div>
    </div>

    <div class="layout__hero layout__box">HERO</div>

    <div class="layout__content">
      <div class="layout__main layout__box">MAIN</div>
      <div class="layout__blank"></div>
      <div class="layout__image layout__box">IMAGE</div>
      <div class="layout__extra layout__box">EXTRA</div>
    </div>

    <div class="layout__banner layout__box">BANNER</div>
  </div>
</body>
</html>
